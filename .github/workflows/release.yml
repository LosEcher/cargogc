name: release

# Assets are named `<tool>-<os>-<arch>` on purpose: without the platform suffix the three
# jobs overwrite each other's asset of the same name (see the fleet's tool-repo convention).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to attach the assets to (e.g. v0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: cargogc-linux-x86_64
            # The musl toolchain needs `musl-gcc` only when a dependency compiles C. cargogc's
            # only dependency is `libc` (bindings, no C build), so this is belt-and-braces.
            apt: musl-tools
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: cargogc-darwin-arm64
            apt: ""
          - os: macos-13
            target: x86_64-apple-darwin
            asset: cargogc-darwin-x86_64
            apt: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: cargogc-windows-x86_64.exe
            apt: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install musl toolchain
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # Only consulted if something ever compiles C for musl.
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: stage the asset
        shell: bash
        run: |
          set -euo pipefail
          src="target/${{ matrix.target }}/release/cargogc"
          [ -f "${src}.exe" ] && src="${src}.exe"
          cp "${src}" "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          # A release asset nobody can run is worse than no asset: prove it starts.
          ./"${{ matrix.asset }}" --version
          cat "${{ matrix.asset }}.sha256"

      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${tag}" --repo "${{ github.repository }}" \
                 --title "${tag}" --notes "cargogc ${tag}"
          gh release upload "${tag}" --repo "${{ github.repository }}" \
            "${{ matrix.asset }}" "${{ matrix.asset }}.sha256" --clobber
